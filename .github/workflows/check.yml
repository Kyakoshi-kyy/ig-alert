name: Instagram 5-Min Alert

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-ig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install browser client
        run: pip install curl_cffi

      - name: Check Instagram and Notify
        env:
          IG_USER: "arcadiacinema"
          NTFY_TOPIC: "ig-watch-83920-alert"
        run: python3 check.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_id.txt
          git commit -m "Update" || exit 0
          git push
