name: Instagram 5-Min Alert

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-ig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Mirror and Notify
        env:
          IG_USER: "arcadiacinema"
          NTFY_TOPIC: "ig-watch-83920-alert"
        run: |
          python3 -c '
          import os, re, urllib.request

          user = os.environ["IG_USER"]
          topic = os.environ["NTFY_TOPIC"]
          mirror_url = "https://imginn.com" + "/" + user + "/"

          req = urllib.request.Request(
              mirror_url,
              headers={"User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)"}
          )
          html = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", errors="ignore")

          matches = re.findall(r"/p/([A-Za-z0-9_-]+)/", html)
          if not matches:
              raise Exception("No posts found or mirror blocked")

          shortcode = matches[0]
          post_url = "https://instagram.com" + "/p/" + shortcode + "/"

          last_id = open("last_id.txt").read().strip() if os.path.exists("last_id.txt") else ""

          if shortcode and shortcode != last_id:
              with open("last_id.txt", "w") as f:
                  f.write(shortcode)
              notify = urllib.request.Request(
                  "https://ntfy.sh" + "/" + topic,
                  data=("New post on @" + user).encode("utf-8"),
                  headers={"Title": "New post from @" + user, "Click": post_url}
              )
              urllib.request.urlopen(notify)
              print("Sent alert for:", shortcode)
          else:
              print("No new posts.")
          '

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_id.txt
          git commit -m "Update" || exit 0
          git push
