name: Instagram 5-Min Alert

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-ig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install browser client
        run: pip install curl_cffi

      - name: Check Instagram and Notify
        env:
          IG_USER: "arcadiacinema"
          NTFY_TOPIC: "ig-watch-83920-alert"
        run: |
          python3 -c '
          import os, re, urllib.request
          from curl_cffi import requests

          user = os.environ["IG_USER"]
          topic = os.environ["NTFY_TOPIC"]

          # Try Instagram public embed page first, then Imginn via Chrome impersonation
          urls = [
              "https://instagram.com" + "/" + user + "/embed/",
              "https://imginn.com" + "/" + user + "/"
          ]

          matches = []
          for u in urls:
              try:
                  r = requests.get(u, impersonate="chrome", timeout=20)
                  if r.status_code == 200:
                      found = re.findall(r"/p/([A-Za-z0-9_-]+)/", r.text)
                      if found:
                          matches = found
                          print("Fetched from:", u)
                          break
              except Exception as e:
                  print("Failed:", u, e)

          if not matches:
              raise Exception("Blocked on all sources")

          shortcode = matches
          post_url = "https://instagram.com" + "/p/" + shortcode + "/"

          last_id = open("last_id.txt").read().strip() if os.path.exists("last_id.txt") else ""

          if shortcode and shortcode != last_id:
              with open("last_id.txt", "w") as f:
                  f.write(shortcode)
              notify = urllib.request.Request(
                  "https://ntfy.sh" + "/" + topic,
                  data=("New post on @" + user).encode("utf-8"),
                  headers={"Title": "New post from @" + user, "Click": post_url}
              )
              urllib.request.urlopen(notify)
              print("Sent alert for:", shortcode)
          else:
              print("No new posts.")
          '

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_id.txt
          git commit -m "Update" || exit 0
          git push
